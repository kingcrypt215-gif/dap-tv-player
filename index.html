let currentCategory = "Channels";
let currentIndex = 0;
let filteredChannels = [];

function buildChannelList() {
    list.innerHTML = "";
    channelsWithCategories = [];
    let currentCat = "General";
    
    channelData.forEach((item, index) => {
        if (item.type === "header") {
            currentCat = item.name;
            const headerDiv = document.createElement("div");
            headerDiv.className = "section-header";
            headerDiv.innerText = currentCat;
            list.appendChild(headerDiv);
        } else {
            const channelObj = { ...item, category: currentCat, originalIndex: index };
            channelsWithCategories.push(channelObj);
            
            const btn = document.createElement("button");
            btn.className = "btn";
            btn.innerText = item.name;
            btn.dataset.index = channelsWithCategories.length - 1;
            btn.onclick = () => selectChannel(channelsWithCategories.length - 1);
            list.appendChild(btn);
        }
    });
    filteredChannels = channelsWithCategories;
}

function selectChannel(filteredIdx) {
    if (filteredChannels.length === 0) return;
    if (filteredIdx < 0) filteredIdx = filteredChannels.length - 1;
    if (filteredIdx >= filteredChannels.length) filteredIdx = 0;
    
    currentIndex = filteredIdx;
    const ch = filteredChannels[currentIndex];
    
    display.innerText = ch.name;
    badge.innerText = ch.category;
    titleOverlay.innerText = ch.name;
    
    const btns = list.getElementsByClassName("btn");
    Array.from(btns).forEach(b => b.classList.remove("active"));
    
    // Find matching button element in DOM
    for (let b of btns) {
        if (b.innerText === ch.name) {
            b.classList.add("active");
            b.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
            break;
        }
    }
    
    player.src({ type: 'application/x-mpegURL', src: ch.url });
    player.play().catch(e => console.log("Autoplay blocked/errored:", e));
}

function nav(direction) {
    let nextIdx = currentIndex + direction;
    selectChannel(nextIdx);
}

function filterChannels() {
    const query = document.getElementById("search-bar").value.toLowerCase();
    const btns = list.getElementsByClassName("btn");
    const headers = list.getElementsByClassName("section-header");
    
    filteredChannels = [];
    let visibleCount = 0;
    
    channelData.forEach((item) => {
        if (item.type === "header") {
            // Headers can be shown or handled contextually, for now filter buttons inside
        }
    });

    Array.from(btns).forEach((btn) => {
        const text = btn.innerText.toLowerCase();
        const match = text.includes(query);
        btn.style.display = match ? "block" : "none";
        if (match) {
            const foundObj = channelsWithCategories.find(c => c.name === btn.innerText);
            if (foundObj && !filteredChannels.includes(foundObj)) {
                filteredChannels.push(foundObj);
            }
        }
    });
}

// Keyboard / Remote Navigation Support
window.addEventListener('keydown', (e) => {
    if (document.activeElement.id === 'search-bar') return;
    if (e.key === 'ArrowUp') {
        nav(-1);
        e.preventDefault();
    } else if (e.key === 'ArrowDown') {
        nav(1);
        e.preventDefault();
    } else if (e.key === 'Enter') {
        player.paused() ? player.play() : player.pause();
        e.preventDefault();
    }
});

buildChannelList();
if (filteredChannels.length > 0) {
    selectChannel(0);
}
