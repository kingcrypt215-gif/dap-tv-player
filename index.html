let currentCategory = "";
channelData.forEach(item => {
if (item.type === "header") currentCategory = item.name;
else channelsWithCategories.push({ ...item, category: currentCategory });
});
function playChannel(index) {
const ch = channelsWithCategories[index];
player.src({src: ch.url, type: 'application/x-mpegURL'});
player.play();
display.innerText = (index + 1) + ". " + ch.name;
badge.innerText = ch.category;
localStorage.setItem('dap_last_channel', index);
titleOverlay.innerText = (index + 1) + ". " + ch.name;
titleOverlay.style.opacity = 1;
setTimeout(() => { titleOverlay.style.opacity = 0; }, 2000);
const activeBtn = document.getElementById('channel-' + index);

document.querySelectorAll('.btn').forEach(btn => btn.classList.remove('active'));
if (activeBtn) {
activeBtn.classList.add('active');
activeBtn.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
activeBtn.focus();
}
}
function nav(direction) {
let currentIdx = parseInt(localStorage.getItem('dap_last_channel')) || 0;
currentIdx = (currentIdx + direction + channelsWithCategories.length) % channelsWithCategories.length;
playChannel(currentIdx);
}
function filterChannels() {
const filter = document.getElementById('search-bar').value.toUpperCase();
const items = document.querySelectorAll('.btn, .section-header');
items.forEach(item => {
const text = item.innerText.toUpperCase();
item.style.display = text.indexOf(filter) > -1 ? "" : "none";
});
}
document.addEventListener('keydown', (e) => {
if (e.key === "ArrowUp" || e.key === "ArrowLeft") { e.preventDefault(); nav(-1); }
if (e.key === "ArrowDown" || e.key === "ArrowRight") { e.preventDefault(); nav(1); }
if (e.key === "Enter" || e.key === " " || e.key === "OK") { e.preventDefault(); document.activeElement.click(); }
if (e.key === "Escape" || e.key === "Back") { e.preventDefault(); if (document.activeElement !== document.body) document.activeElement.blur(); }
if (e.key === "PageUp") { e.preventDefault(); nav(-10); }
if (e.key === "PageDown") { e.preventDefault(); nav(10); }
if (e.key === "Home") { e.preventDefault(); playChannel(0); }
if (e.key === "End") { e.preventDefault(); playChannel(channelsWithCategories.length - 1); }
});

// Touch swipe support for mobile devices
let touchStartX = 0;
let touchStartY = 0;
const playerWrapper = document.getElementById('player-wrapper');
const chList = document.getElementById('ch-list');

playerWrapper.addEventListener('touchstart', (e) => {
touchStartX = e.touches[0].clientX;
touchStartY = e.touches[0].clientY;
}, { passive: true });

playerWrapper.addEventListener('touchend', (e) => {
const touchEndX = e.changedTouches[0].clientX;
const touchEndY = e.changedTouches[0].clientY;
const diffX = touchStartX - touchEndX;
const diffY = touchStartY - touchEndY;

if (Math.abs(diffX) > Math.abs(diffY)) {
if (Math.abs(diffX) > 50) {
if (diffX > 0) nav(1);
else nav(-1);
}
}
}, { passive: true });

// Scroll settled - can add any post-scroll logic here
}, 150);
}, { passive: true });

const firstBtn = document.querySelector('.btn');
if (firstBtn && !('ontouchstart' in window)) {
firstBtn.focus();
}
}, 500);
channelData.forEach((item, index) => {
if (item.type === "header") {
const h = document.createElement('div'); h.className = 'section-header'; h.innerText = item.name; list.appendChild(h);
} else {
const btn = document.createElement('button'); btn.className = 'btn';
const flatIdx = channelsWithCategories.findIndex(c => c.name === item.name);
btn.id = 'channel-' + flatIdx;
btn.innerText = (flatIdx + 1) + ". " + item.name;
btn.setAttribute('role', 'option');
btn.setAttribute('aria-label', item.name);
btn.onclick = () => playChannel(flatIdx); list.appendChild(btn);
}
});

playChannel(savedChannel != null ? parseInt(savedChannel) : 0); </script>
